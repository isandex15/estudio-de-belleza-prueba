name: pruebas_integracion

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-tests:
    name: Pruebas de integración
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASS: ci-root-password
      DB_NAME: sac

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: sac
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=$$MYSQL_ROOT_PASSWORD --silent"
          --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install --yes default-mysql-client
          python -m pip install --upgrade pip
          python -m pip install pytest Flask mysql-connector-python python-dotenv requests bcrypt reportlab openpyxl locust

      - name: Inicializar base de pruebas
        run: |
          mysql --host="$DB_HOST" --user="$DB_USER" --password="$DB_PASS" < db/integration_test_schema.sql
          mysql --host="$DB_HOST" --user="$DB_USER" --password="$DB_PASS" < db/procedimientoscompras.sql

      - name: Ejecutar pruebas de integración
        run: |
          mkdir -p test-results
          python -m pytest "pytest/test/pruebas de integracion" -q --junitxml=test-results/integration-tests.xml

      - name: Guardar reporte de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-pruebas-integracion
          path: test-results/integration-tests.xml
          if-no-files-found: ignore
