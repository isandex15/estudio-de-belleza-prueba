name: Playwright

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    name: Pruebas Playwright (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASS: ci-root-password
      DB_NAME: sac
      LOCUST_CEDULA: "4723317"
      LOCUST_PASSWORD: admin123

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: sac
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=$$MYSQL_ROOT_PASSWORD --silent"
          --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias de la aplicación
        run: |
          sudo apt-get update
          sudo apt-get install --yes default-mysql-client
          python -m pip install --upgrade pip
          python -m pip install Flask mysql-connector-python python-dotenv requests bcrypt captcha reportlab openpyxl

      - name: Inicializar base de pruebas
        run: |
          mysql --host="$DB_HOST" --user="$DB_USER" --password="$DB_PASS" < db/integration_test_schema.sql
          mysql --host="$DB_HOST" --user="$DB_USER" --password="$DB_PASS" < db/procedimientoscompras.sql
          python locust/seed_ci.py

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: playwright/package-lock.json

      - name: Instalar dependencias de Playwright
        working-directory: playwright
        run: npm ci

      - name: Instalar Chromium
        working-directory: playwright
        run: npx playwright install --with-deps chromium

      - name: Ejecutar todas las pruebas Playwright
        working-directory: playwright
        run: |
          mkdir -p test-results
          npm test -- --project=chromium

      - name: Guardar reporte XML de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-playwright-junit
          path: |
            playwright/test-results/junit.xml
            playwright/evidencias/
          if-no-files-found: ignore
