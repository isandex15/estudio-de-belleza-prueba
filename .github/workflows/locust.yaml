name: Locust

on:
  workflow_call:
    inputs:
      locustfile:
        description: Locust scenario file name
        required: true
        type: string
  workflow_dispatch:
    inputs:
      locustfile:
        description: Locust scenario to execute
        required: true
        type: choice
        default: compra.py
        options:
          - categoria.py
          - compra.py
          - marca.py
          - producto.py
          - promocion.py
          - proveedor.py
          - tipoproducto.py
          - tiposervicio.py

permissions:
  contents: read

jobs:
  locust-smoke:
    name: Prueba de carga acotada (local)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASS: locust-ci-password
      DB_NAME: sac
      LOCUST_CEDULA: CI00000001
      LOCUST_COD_CATEGORIA: "1"
      LOCUST_COD_MARCA: "1"
      LOCUST_COD_PROVEEDOR: "1"
      LOCUST_COD_PRODUCTO: "1"
      LOCUST_COD_UNIDAD: "1"
      LOCUST_COD_TIPO_PRODUCTO: "1"
      LOCUST_COD_PRESENTACION: "1"
      LOCUST_COD_MEDIDA: "1"

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: locust-ci-password
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: sac
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=$$MYSQL_ROOT_PASSWORD --silent"
          --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install --yes default-mysql-client
          python -m pip install --upgrade pip
          python -m pip install Flask mysql-connector-python python-dotenv requests bcrypt captcha reportlab openpyxl locust

      - name: Inicializar base de pruebas
        run: |
          mysql --host="$DB_HOST" --user="$DB_USER" --password="$DB_PASS" < db/integration_test_schema.sql
          mysql --host="$DB_HOST" --user="$DB_USER" --password="$DB_PASS" < db/procedimientoscompras.sql
          python locust/seed_ci.py

      - name: Ejecutar carga local y acotada
        run: |
          mkdir -p locust-report
          python run_playwright_server.py > locust-report/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; wait "$SERVER_PID" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5000/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:5000/ > /dev/null

          set +e
          python -m locust \
            --locustfile "locust/${{ inputs.locustfile }}" \
            --headless \
            --host http://127.0.0.1:5000 \
            --users 2 \
            --spawn-rate 1 \
            --run-time 20s \
            --exit-code-on-error 1 \
            --csv locust-report/locust
          LOCUST_EXIT=$?

          python locust/csv_to_junit.py \
            locust-report/locust_stats.csv \
            "locust-report/${{ inputs.locustfile }}.xml"
          REPORT_EXIT=$?

          if [ "$LOCUST_EXIT" -ne 0 ]; then
            exit "$LOCUST_EXIT"
          fi
          exit "$REPORT_EXIT"

      - name: Guardar reportes de Locust
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-locust-${{ inputs.locustfile }}
          path: locust-report/
          if-no-files-found: ignore
