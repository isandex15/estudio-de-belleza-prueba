$kind: http-request
url: "{{base_url}}"
method: POST
body:
  type: urlencoded
  content:
    respuesta: "{{captcha_respuesta}}"
    verificar_captcha: "1"
scripts:
  - type: afterResponse
    code: "pm.test(\"Respuesta JSON\", () => {\r

      \  pm.response.to.be.json;\r

      });\r

      \r

      pm.test(\"Estado correcto se verifico el captcha\", () => {\r

      \  pm.response.to.have.status(200);\r

      });"
    language: text/javascript
order: 3000
