$kind: http-request
url: "{{unidad_url}}"
method: POST
body:
  type: urlencoded
  content:
    eliminar: "1"
    cod_unidad: "7"
scripts:
  - type: afterResponse
    code: "pm.test(\"respuesta de JSON \",  ()=> {\r

      \    pm.response.to.be.json;\r

      \  });\r

      \r

      pm.test(\"estado corecto del eliminar\", () => {\r

      \    pm.response.to.have.status(200);\r

      \     });"
    language: text/javascript
order: 4000
