
$kind: http-request
name: consultar medida
url: "{{unidadmedida_url}}"
method: GET
scripts:
  - type: afterResponse
    code: |
      pm.test("respuesta de JSON", () => {
          pm.response.to.be.json;
      });

      pm.test("estado correcto de consultar medida", () => {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 3000

