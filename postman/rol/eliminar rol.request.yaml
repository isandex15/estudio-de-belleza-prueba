$kind: http-request
url: "{{rol_url}}"
method: POST
body:
  type: urlencoded
  content:
    eliminar: eliminado
    cod_rol: "12"
scripts:
  - type: afterResponse
    code: "pm.test(\"respuesta JSON\",  ()=> {\r

      \    pm.response.to.be.json;\r

      \ });\r

      \r

      \ pm.test(\"estado corecto de eliminar \",()=>{\r

      \     pm.response.to.have.status(200);\r

      \ } );"
    language: text/javascript
order: 4000
